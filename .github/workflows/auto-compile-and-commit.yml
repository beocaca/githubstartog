name: Go Build and Compile

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Build and compile
        env:
          LLM_BASEURL: ${{ secrets.LLM_BASEURL }}
          LLM_TOKEN: ${{ secrets.LLM_TOKEN }}
        run: |
          go build -o ./bin/starProject

      - name: Execute compiled binary
        env:
          LLM_BASEURL: ${{ secrets.LLM_BASEURL }}
          LLM_TOKEN: ${{ secrets.LLM_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/starProject

      - name: Copy aiTagProcess.json to web/public
        run: |
          cp aiTagProcess.json web/public/projects.json

      - name: Check for changes
        id: diff
        run: |
          git add aiTagProcess.json web/public/projects.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: No changes log
        if: steps.diff.outputs.changed == 'false'
        run: echo "No changes to commit"

      - name: Set commit message
        id: set_message
        if: steps.diff.outputs.changed == 'true'
        run: |
          added_lines="$(git diff -U0 HEAD -- aiTagProcess.json | sed -n 's/^+//p')"

          summary_lines="$(printf '%s\n' "$added_lines" | \
            awk '
              /"full_name":/ {
                if (match($0, /"full_name": *"([^"]+)"/, m)) name=m[1]
              }
              /"stargazers_count":/ {
                if (match($0, /"stargazers_count": *([0-9]+)/, m)) {
                  stars=m[1]
                  if (name != "") {
                    print name " ★ " stars
                    name=""; stars=""
                  }
                }
              }
            ' | awk 'NF' | head -n 5 )"

          count="$(printf '%s\n' "$summary_lines" | wc -l | tr -d ' ')"
          joined="$(printf '%s\n' "$summary_lines" | paste -sd ', ' -)"

          msg="${count} : ${joined}"

          max=250
          if [ "${#msg}" -gt "$max" ]; then
            msg="${msg:0:$((max-3))}..."
          fi

          {
            echo "commit_message<<EOF"
            echo "$msg"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit & push
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "${{ steps.set_message.outputs.commit_message }}"
          git push

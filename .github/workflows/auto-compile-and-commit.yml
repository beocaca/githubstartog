name: Go Build and Compile

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Manual trigger'
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours

jobs:
  build-and-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important so we can diff against previous commit

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Build and compile
        env:
          LLM_BASEURL: ${{ secrets.LLM_BASEURL }}
          LLM_TOKEN: ${{ secrets.LLM_TOKEN }}
        run: |
          go build -o ./bin/starProject

      - name: Execute compiled binary
        env:
          LLM_BASEURL: ${{ secrets.LLM_BASEURL }}
          LLM_TOKEN: ${{ secrets.LLM_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/starProject

      - name: Copy aiTagProcess.json to web/public
        run: |
          cp aiTagProcess.json web/public/projects.json

      - name: Set commit message from diff
        id: set_message
        run: |
          if git diff --quiet HEAD aiTagProcess.json; then
            echo "commit_message=No AI tag changes" >> $GITHUB_OUTPUT
          else
            summary=$(git diff --unified=0 HEAD aiTagProcess.json | grep '^+' | tail -n +2 | head -n 5 | tr '\n' ' ')
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "commit_message=Scheduled run - AI tag updates: $summary" >> $GITHUB_OUTPUT
            elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "commit_message=Manual run (${GITHUB_EVENT_INPUTS_REASON}) - AI tag updates: $summary" >> $GITHUB_OUTPUT
            else
              echo "commit_message=Push run - AI tag updates: $summary" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Commit all files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "${{ steps.set_message.outputs.commit_message }}" || echo "No changes to commit"
          git push
